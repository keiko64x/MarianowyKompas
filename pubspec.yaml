name: medicine_compass
description: Medicine Compass — peer-to-peer people radar with real-time GPS navigation.
publish_to: 'none'
version: 1.2.0+15

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  shared_preferences: ^2.3.5
  http: ^1.2.2
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ikony/android/playstore-icon.png
  adaptive_icon_background: "#1A2E1F"
  adaptive_icon_foreground: ikony/android/playstore-icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - ikony/android/playstore-icon.png
