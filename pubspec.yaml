name: szadejkompas
description: Szadejkompas — radar osób peer-to-peer z nawigacją GPS w czasie rzeczywistym.
publish_to: 'none'
version: 3.0.0+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  shared_preferences: ^2.3.5
  http: ^1.2.2
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: ikony/android/playstore-icon.png
  adaptive_icon_background: "#12141C"
  adaptive_icon_foreground: ikony/android/playstore-icon.png

flutter:
  uses-material-design: true
  assets:
    - ikony/android/playstore-icon.png
