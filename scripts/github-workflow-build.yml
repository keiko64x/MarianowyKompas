name: Build APK & iOS
on:
  push:
    branches: [ main ]
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: medicine-compass-android-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: |
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create . --project-name medicine_compass --org net.szadejko --platforms=ios
          fi
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('ios/Runner/Info.plist')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'(<key>CFBundleDisplayName</key>\s*<string>)[^<]+(</string>)', r'\1Medicine Compass\2', text)
          text = re.sub(r'(<key>CFBundleName</key>\s*<string>)[^<]+(</string>)', r'\1Medicine Compass\2', text)
          if 'NSCameraUsageDescription' not in text:
              inject = "\t<key>NSCameraUsageDescription</key>\n\t<string>Medicine Compass needs the camera to scan friend QR codes for pairing.</string>\n"
              text = text.replace('</dict>\n</plist>', inject + '</dict>\n</plist>')
          path.write_text(text, encoding='utf-8')
          PY
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p payload
          cp -R build/ios/iphoneos/Runner.app payload/MedicineCompass.app
          cd payload && zip -r ../MedicineCompass-ios-unsigned.zip MedicineCompass.app
      - uses: actions/upload-artifact@v4
        with:
          name: medicine-compass-ios-unsigned
          path: MedicineCompass-ios-unsigned.zip
